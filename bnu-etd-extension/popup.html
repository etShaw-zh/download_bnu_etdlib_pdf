<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>小鸦PDF</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div class="heading-row">
          <div class="brand">
            <img class="brand-icon" src="icons/icon-128.png" alt="" width="40" height="40">
            <h1>小鸦PDF</h1>
          </div>
          <div class="update-tools">
            <span id="current-version" class="current-version"></span>
            <a id="update-btn" class="update-btn" href="https://github.com/etShaw-zh/download_bnu_etdlib_pdf/releases/latest" target="_blank" rel="noopener noreferrer" title="打开最新发布页面，对照当前版本" aria-live="polite">检查更新 ↗</a>
          </div>
        </div>
        <p class="description">北师大学位论文，一键导出为 PDF。</p>
        <a class="library-link" href="https://etdlib.bnu.edu.cn/home" target="_blank" rel="noopener noreferrer">
          <span>✈️ 学位论文服务系统</span><span aria-hidden="true">↗</span>
        </a>
        <section class="usage-guide" aria-labelledby="usage-title">
          <h2 id="usage-title">使用方法</h2>
          <ol>
            <li>打开论文详情页或阅读页</li>
            <li>点击下方「开始加载并导出」</li>
            <li>保持页面在前台，等待 PDF 下载</li>
          </ol>
        </section>
      </header>
      <section class="status-block">
        <p id="status" role="status">等待启动…</p>
        <div class="progress">
          <div id="progress-bar"></div>
        </div>
        <button id="start-btn" type="button">开始加载并导出</button>
      </section>
      <p class="support">
        喜欢小鸦PDF？到
        <a href="https://github.com/etShaw-zh/download_bnu_etdlib_pdf" target="_blank" rel="noopener noreferrer">GitHub</a>
        点个 ⭐️ 支持作者。
      </p>
      <section class="notice">
        <h2>版权与免责</h2>
        <p>导出的内容受北京师范大学及作者版权保护，仅限本人学习与科研参考，严禁对外传播、分享或商业使用。</p>
        <p>请在阅读完成后尽快删除导出的文件，若违规使用造成法律风险或损失，责任由使用者自行承担。</p>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
